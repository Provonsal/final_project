{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
{% if error %}<pre class="error">{{ error }}</pre>{% endif %}
<form method="post" action="/views/auth/login">
  <label>Username <input name="username" value="{{ username or '' }}" required autofocus></label>
  <label>Password <input name="password" type="password" required></label>
  <button type="submit">Login</button>
</form>
<p>Нет аккаунта? <a href="/views/auth/register">Регистрация</a></p>
{% endblock %}
