{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
{% if error %}<pre class="error">{{ error }}</pre>{% endif %}
<form method="post" action="/views/auth/register">
  <label>Username <input name="username" value="{{ form.username or '' }}" required autofocus></label>
  <label>Name <input name="name" value="{{ form.name or '' }}" required></label>
  <label>Password <input name="password" type="password" required></label>
  <label>Role
    <select name="role">
      {% for r in ["guest", "auth", "manager", "member"] %}
        <option value="{{ r }}" {% if (form.role or 'guest') == r %}selected{% endif %}>{{ r }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Register</button>
</form>
<p>Уже есть аккаунт? <a href="/views/auth/login">Войти</a></p>
{% endblock %}
