{% extends "base.html" %}
{% block title %}{{ "New Comment" if mode == "create" else "Edit Comment" }}{% endblock %}
{% block content %}
<h1>{{ "New Comment" if mode == "create" else "Edit Comment" }}</h1>
{% if error %}<pre class="error">{{ error }}</pre>{% endif %}
<form method="post">
  <label>Text
    <textarea name="text" {% if mode == "create" %}required{% endif %}>{{ comment.text }}</textarea>
  </label>
  <button type="submit">Save</button>
  <a class="btn" href="/views/teams/{{ team_id }}/tasks/{{ task_id }}/comments">Cancel</a>
</form>
{% endblock %}
